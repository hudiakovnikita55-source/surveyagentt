[project]
name = "surveyagent"
version = "0.1.0"
description = "Synthetic survey respondents: realistic European personas that fill in questionnaires"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8", "requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
surveyagent = "surveyagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surveyagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
