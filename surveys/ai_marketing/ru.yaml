# «Использование ИИ в маркетинге и продвижении» - версия RU.
# Те же коды (P1-P15), порядок вариантов и логика, что в en.yaml и pl.yaml.
title: "АНКЕТА: Использование ИИ в маркетинге и продвижении"
language: RU
description: >
  Эта анкета является частью международного исследования. Она предназначена для людей, которые в течение
  последних 12 месяцев занимались маркетингом или продвижением, независимо от страны работы.
  Участие добровольное и анонимное. Мы не собираем данные, позволяющие напрямую установить Вашу личность.
  Результаты будут анализироваться только в обобщённом виде. Заполнение анкеты займёт около 5–6 минут.
  Под «ИИ» в анкете понимаются такие инструменты, как ChatGPT, Gemini, Claude, Copilot, Canva AI, а также
  функции ИИ в рекламных и маркетинговых системах.
questions:
  # I. Согласие и соответствие критериям
  - id: P1
    section: I. Согласие и соответствие критериям
    topic: consent
    title: Согласны ли Вы добровольно принять участие в анонимном исследовании?
    type: single_choice
    required: true
    options: ["Да", "Нет"]
    go_to: {"Нет": end}

  - id: P2
    section: I. Согласие и соответствие критериям
    topic: did_marketing
    title: Занимались ли Вы маркетингом или продвижением в течение последних 12 месяцев?
    type: single_choice
    required: true
    options: ["Да", "Нет"]
    go_to: {"Нет": end}

  # II. Информация о респонденте
  - id: P3
    section: II. Информация о респонденте
    topic: work_country
    title: В какой стране Вы выполняете большую часть работы, связанной с маркетингом или продвижением?
    type: short_text
    required: true

  - id: P4
    section: II. Информация о респонденте
    topic: marketing_setting
    title: Какой вариант лучше всего описывает Вашу работу?
    type: single_choice
    required: true
    options:
      - Работаю в маркетинговом или рекламном агентстве
      - Работаю в отделе маркетинга компании или организации
      - Работаю как фрилансер
      - Веду собственный бизнес и самостоятельно занимаюсь маркетингом
      - Другая роль, связанная с маркетингом (укажите)

  - id: P5
    section: II. Информация о респонденте
    topic: marketing_years
    title: Как долго Вы работаете в сфере маркетинга или продвижения?
    type: single_choice
    required: true
    options: [Менее 1 года, 1–3 года, 4–6 лет, 7–10 лет, Более 10 лет]

  - id: P6
    section: II. Информация о респонденте
    topic: org_size
    title: Сколько человек работает в организации, для которой Вы выполняете большую часть маркетинговых задач?
    type: single_choice
    required: true
    options:
      - Работаю самостоятельно / бизнес из одного человека
      - 2–9 человек
      - 10–49 человек
      - 50–249 человек
      - 250 человек и более
      - Затрудняюсь ответить / не применимо

  # III. Использование ИИ
  - id: P7
    section: III. Использование ИИ
    topic: ai_use
    title: Использовали ли Вы ИИ в маркетинговой работе или продвижении в течение последних 12 месяцев?
    type: single_choice
    required: true
    options: ["Да", "Нет"]
    go_to: {"Нет": P12}

  - id: P8
    section: III. Использование ИИ
    topic: ai_frequency
    title: Как часто Вы используете ИИ в маркетинговой работе или продвижении?
    type: single_choice
    required: true
    options: [Каждый день, Несколько раз в неделю, Раз в неделю, Несколько раз в месяц, Реже одного раза в месяц]

  - id: P9
    section: III. Использование ИИ
    topic: ai_tool_types
    title: Какие виды инструментов ИИ Вы используете?
    type: checkboxes
    required: true
    options:
      - Генерация текста (например, ChatGPT, Gemini, Claude, Copilot)
      - Создание изображений или видео (например, Midjourney, DALL·E, Canva AI)
      - ИИ в рекламных системах или системах автоматизации маркетинга
      - Аналитика, прогнозирование или сегментация аудитории
      - Чат-боты или поддержка клиентов
      - Другое (укажите)

  - id: P10
    section: III. Использование ИИ
    topic: ai_task_use
    title: Для каких маркетинговых задач Вы используете ИИ?
    type: grid
    required: true
    rows:
      - Анализ аудитории и рынка
      - Планирование стратегии, целей и KPI
      - Сегментация, создание персон и персонализация
      - Написание рекламных и маркетинговых текстов
      - Создание или редактирование изображений и видео
      - Запуск или оптимизация рекламных кампаний
      - Коммуникация с аудиторией, поддержка клиентов и чат-боты
      - Анализ результатов и подготовка отчётов
    options: [Никогда, В редких задачах, В некоторых задачах, В большинстве задач, Почти всегда, Я не выполняю такие задачи]

  # IV. Эффекты, барьеры и ответственное использование
  - id: P11
    section: IV. Эффекты, барьеры и ответственное использование
    topic: ai_effects
    title: Насколько Вы согласны со следующими утверждениями?
    type: grid
    required: true
    rows:
      - Благодаря ИИ я быстрее выполняю маркетинговые задачи
      - ИИ помогает мне лучше адаптировать коммуникацию к аудитории
      - ИИ помогает мне создавать больше идей и контента
      - ИИ упрощает анализ данных и принятие решений
      - ИИ повышает качество подготовленных материалов
    options:
      - Полностью не согласен/не согласна
      - Скорее не согласен/не согласна
      - Ни согласен/согласна, ни не согласен/не согласна
      - Скорее согласен/согласна
      - Полностью согласен/согласна
      - Затрудняюсь ответить

  - id: P12
    section: IV. Эффекты, барьеры и ответственное использование
    topic: ai_barriers
    title: Насколько серьёзными препятствиями для Вас являются следующие факторы?
    type: grid
    required: true
    rows:
      - Ошибочные или выдуманные ответы ИИ
      - Защита данных и конфиденциальность
      - Авторское право и соблюдение законодательства
      - Контент не соответствует стилю или качеству бренда
      - Предвзятые или дискриминационные ответы
      - Недостаток навыков или чётких правил
      - Затраты или сложности внедрения и интеграции
    options: [Не является препятствием, Незначительное, Умеренное, Серьёзное, Очень серьёзное, Затрудняюсь ответить]

  - id: P13
    section: IV. Эффекты, барьеры и ответственное использование
    topic: ai_risk_practices
    title: Что делаете Вы или Ваша организация, чтобы снизить риски, связанные с ИИ?
    type: checkboxes
    required: true
    options:
      - Контент проверяет человек
      - Мы не вводим в инструменты ИИ конфиденциальные или персональные данные
      - Мы проверяем факты и источники
      - Материалы утверждает руководитель или клиент
      - Мы проводим обучение или используем внутренние правила по ИИ
      - Мы сообщаем об использовании ИИ, когда это требуется
      - Мы не применяем формальные меры
      - Я не использую ИИ / не применимо — выберите только этот вариант
    exclusive: [Я не использую ИИ / не применимо — выберите только этот вариант]

  - id: P14
    section: IV. Эффекты, барьеры и ответственное использование
    topic: ai_training
    title: Проходили ли Вы обучение по использованию ИИ в маркетинге или коммуникации?
    type: single_choice
    required: true
    options: ["Да", "Нет, но планирую", "Нет и не планирую"]

  # V. Открытый вопрос
  - id: P15
    section: V. Открытый вопрос
    topic: ai_open_view
    title: Если хотите, кратко опишите одно преимущество, одну проблему или одно условие ответственного использования ИИ в маркетинге.
    type: paragraph
    required: false
