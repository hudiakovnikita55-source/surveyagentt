# "Use of AI in marketing and promotion" - EN version.
# Same ids (P1-P15), option order and logic as pl.yaml and ru.yaml, so the three versions can be merged.
# go_to = "Go to section based on answer" in Google Forms; exclusive = option that must be ticked alone.
# topic = what the question measures (used by the offline answerer, independent of the language).
title: "QUESTIONNAIRE: Use of AI in marketing and promotion"
language: EN
description: >
  This questionnaire is part of an international study. It is intended for people who have worked in
  marketing or promotional activities during the past 12 months, regardless of the country in which they
  work. Participation is voluntary and anonymous. We do not collect information that directly identifies
  you. Results will be analysed only in aggregate. The questionnaire takes about 5-6 minutes.
  In this questionnaire, "AI" means tools such as ChatGPT, Gemini, Claude, Copilot, Canva AI, and AI
  features in advertising and marketing systems.
questions:
  # I. Consent and eligibility
  - id: P1
    section: I. Consent and eligibility
    topic: consent
    title: Do you consent to voluntarily participate in this anonymous study?
    type: single_choice
    required: true
    options: ["Yes", "No"]
    go_to: {"No": end}

  - id: P2
    section: I. Consent and eligibility
    topic: did_marketing
    title: During the past 12 months, have you worked in marketing or promotional activities?
    type: single_choice
    required: true
    options: ["Yes", "No"]
    go_to: {"No": end}

  # II. About the respondent
  - id: P3
    section: II. About the respondent
    topic: work_country
    title: In which country do you carry out most of your marketing or promotional work?
    type: short_text
    required: true

  - id: P4
    section: II. About the respondent
    topic: marketing_setting
    title: Which option best describes your work?
    type: single_choice
    required: true
    options:
      - I work at a marketing or advertising agency
      - I work in an in-house marketing team
      - I work as a freelancer
      - I run my own business and manage its marketing
    other: true  # "Other marketing-related role (please specify)"

  - id: P5
    section: II. About the respondent
    topic: marketing_years
    title: How long have you worked in marketing or promotion?
    type: single_choice
    required: true
    options: [Less than 1 year, 1–3 years, 4–6 years, 7–10 years, More than 10 years]

  - id: P6
    section: II. About the respondent
    topic: org_size
    title: How many people work in the organisation for which you perform most of your marketing activities?
    type: single_choice
    required: true
    options:
      - I work independently / one-person business
      - 2–9 people
      - 10–49 people
      - 50–249 people
      - 250 people or more
      - Difficult to say / not applicable

  # III. Use of AI
  - id: P7
    section: III. Use of AI
    topic: ai_use
    title: During the past 12 months, have you used AI in marketing or promotional work?
    type: single_choice
    required: true
    options: ["Yes", "No"]
    go_to: {"No": P12}

  - id: P8
    section: III. Use of AI
    topic: ai_frequency
    title: How often do you use AI in marketing or promotional work?
    type: single_choice
    required: true
    options: [Every day, Several times a week, Once a week, Several times a month, Less than once a month]

  - id: P9
    section: III. Use of AI
    topic: ai_tool_types
    title: Which types of AI tools do you use?
    type: checkboxes
    required: true
    options:
      - Text generation (e.g. ChatGPT, Gemini, Claude, Copilot)
      - Image or video creation (e.g. Midjourney, DALL·E, Canva AI)
      - AI in advertising or marketing automation systems
      - Analytics, prediction, or audience segmentation
      - Chatbots or customer service
    other: true  # "Other (please specify)"

  - id: P10
    section: III. Use of AI
    topic: ai_task_use
    title: For which marketing tasks do you use AI?
    type: grid
    required: true
    rows:
      - Audience and market analysis
      - Strategy, goals, and KPI planning
      - Segmentation, personas, and personalisation
      - Writing promotional content
      - Creating or editing images and video
      - Running or optimising advertising campaigns
      - Audience communication, customer service, and chatbots
      - Results analysis and reporting
    options: [Never, In a few tasks, In some tasks, In most tasks, Almost always, I do not perform this type of task]

  # IV. Effects, barriers, and responsible use
  - id: P11
    section: IV. Effects, barriers, and responsible use
    topic: ai_effects
    title: To what extent do you agree with the following statements?
    type: grid
    required: true
    rows:
      - AI helps me complete marketing tasks faster
      - AI helps me tailor communication to audiences
      - AI helps me create more ideas and content
      - AI makes data analysis and decision-making easier
      - AI improves the quality of prepared materials
    options: [Strongly disagree, Disagree, Neither agree nor disagree, Agree, Strongly agree, Difficult to say]

  - id: P12
    section: IV. Effects, barriers, and responsible use
    topic: ai_barriers
    title: How significant are the following barriers for you?
    type: grid
    required: true
    rows:
      - Incorrect or fabricated AI outputs
      - Data protection and confidentiality
      - Copyright and legal compliance
      - Content that does not match the brand’s style or quality
      - Biased or discriminatory outputs
      - Lack of skills or clear procedures
      - Costs or difficulties with implementation and integration
    options: [Not a barrier, Minor barrier, Moderate barrier, Major barrier, Very major barrier, Difficult to say]

  - id: P13
    section: IV. Effects, barriers, and responsible use
    topic: ai_risk_practices
    title: What do you or your organisation do to reduce risks related to AI?
    type: checkboxes
    required: true
    options:
      - Content is reviewed by a person
      - We do not enter confidential or personal data into AI tools
      - We check facts and sources
      - Materials are approved by a supervisor or client
      - We use training or internal AI guidelines
      - We disclose the use of AI when required
      - We do not use formal practices
      - I do not use AI / not applicable — select only this answer
    exclusive: [I do not use AI / not applicable — select only this answer]

  - id: P14
    section: IV. Effects, barriers, and responsible use
    topic: ai_training
    title: Have you taken part in training on the use of AI in marketing or communication?
    type: single_choice
    required: true
    options: ["Yes", "No, but I plan to", "No, and I do not plan to"]

  # V. Open question
  - id: P15
    section: V. Open question
    topic: ai_open_view
    title: If you wish, briefly describe one benefit, one problem, or one condition for the responsible use of AI in marketing.
    type: paragraph
    required: false
